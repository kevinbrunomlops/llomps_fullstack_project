services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel-chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
    - MLFLOW_MONITORING_PATH=/app/monitoring
    volumes:
      - ./backend/data:/app/backend/data
      - ./monitoring:/app/monitoring
    
    frontend:
      build:
        context: .
        dockerfile: frontend/Dockerfile
      container_name: travel-chatbot-frontend
      ports:
        - "8501.8501"
      env_file:
        - .env
      environment:
        - BACKEND_URL=http://backend:8000
      depends_on:
        - backend
